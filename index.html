<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RED SANS - Plotagens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BANNER TOPO -->
  <header class="header-banner">
    <img src="RED_20260721_141026_0000.png" alt="Red Sans" class="banner-img">
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="content-container">

    <!-- BOX DE AVISOS -->
    <details class="aviso-box">
      <summary>📢 SITE ATUALIZADO 📢</summary>
      <div class="aviso-conteudo">
        <p>🛠️ Todos os links foram atualizados</p>
        <p>🛠️ Área de tutoriais atualizada</p>
        <p>👻 CANAL RED SANS 👻</p>
      </div>
    </details>

    <!-- REDES SOCIAIS -->
    <div class="social-links">
      <a href="https://www.youtube.com/@RedSans00215" target="_blank" class="social-btn red">YouTube</a>
      <a href="#" target="_blank" class="social-btn pink">Instagram</a>
      <a href="#" target="_blank" class="social-btn black">TikTok</a>
    </div>

    <h2 class="section-title">AS ÁREAS DE PLOTAGEM ABAIXO</h2>

    <!-- MENU DE BOTÕES -->
    <div class="category-menu">
      <a href="#plotagens" class="btn-outline">ÁREA DAS PLOTAGENS</a>
      <a href="#tutoriais" class="btn-outline">ÁREA DE TUTORIAIS</a>
      <a href="#apps" class="btn-outline">ÁREA DE APPS</a>
    </div>

    <hr class="divisor">

    <!-- LISTA DE CARROS / PLOTAGENS -->
    <h3 id="plotagens" class="section-subtitle">CLIQUE NO BOTÃO PARA COPIAR</h3>

    <div class="grid-plotagens">
      
      <!-- CARD 1 -->
      <div class="car-card">
        <p class="car-title">PLOTAGEM REDSANS FR 1</p>
        <button class="btn-copiar" onclick="copiarCodigo(this)">Copiar</button>
        <textarea style="display:none;">COLOQUE_SEU_CODIGO_AQUI_1</textarea>
      </div>

      <!-- CARD 2 -->
      <div class="car-card">
        <p class="car-title">PLOTAGEM REDSANS FR 2</p>
        <button class="btn-copiar" onclick="copiarCodigo(this)">Copiar</button>
        <textarea style="display:none;">COLOQUE_SEU_CODIGO_AQUI_2</textarea>
      </div>

    </div>

  </main>

  <!-- BOTÃO INVISÍVEL NO RODAPÉ -->
  <a href="https://www.youtube.com/@RedSans00215" target="_blank" class="link-inscreva-se" title="Inscreva-se no canal"></a>

  <script>
    function copiarCodigo(botao) {
      var textarea = botao.nextElementSibling;
      var texto = textarea.value.trim();

      navigator.clipboard.writeText(texto).then(function() {
        var textoOriginal = botao.innerText;
        botao.innerText = "Copiado! ✓";

        setTimeout(function() {
          botao.innerText = textoOriginal;
        }, 2000);
      }).catch(function(err) {
        alert('Erro ao copiar o código.');
      });
    }
  </script>
</body>
</html>
